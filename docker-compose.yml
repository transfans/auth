services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5435:5432"
    volumes:
      - ./var/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transfans-net

  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #   - transfans-net

  auth-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/auth_db
      JWT_SECRET_KEY: change-me-to-a-real-secret-key-min-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "45"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      RABBITMQ_URL: amqp://guest:guest@profile-rabbitmq:5672/
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      # profile-rabbitmq:
      #   condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - transfans-net

networks:
  transfans-net:
    external: true
